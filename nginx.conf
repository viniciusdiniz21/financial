events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Otimizações básicas
    sendfile        on;
    keepalive_timeout  65;

    # Upstreams (Apontam para as portas expostas pelo seu Docker Compose)
    upstream frontend_app {
        server 127.0.0.1:5173; # Porta do Frontend no Docker
    }

    upstream backend_api {
        server 127.0.0.1:8000; # Porta do Backend no Docker
    }

    server {
        listen 80;
        listen [::]:80;
        
        # Substitua pelo seu domínio ou deixe _ para aceitar qualquer IP
        server_name _; 

        # Proxy para o Frontend
        location / {
            proxy_pass http://frontend_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }

        # Proxy para o Backend (API)
        location /api/ {
            # Remove o /api da URL antes de enviar para o backend se necessário,
            # ou mantém se o FastAPI esperar /api/v1...
            proxy_pass http://backend_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}